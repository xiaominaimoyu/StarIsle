[pytest]
testpaths = tests
pythonpath = ..
# 严格 warning 策略：所有 warning 转为错误，仅显式放行两条已知的测试工具层面弃用通知。
# 1. starlette 1.6 TestClient 弃用 httpx 后端（建议 httpx2）；仅测试工具，不影响 uvicorn 生产运行时。
# 2. anyio 4.15 弃用 anyio.abc.BlockingPortal 别名；由 TestClient 内部触发，不影响生产运行时。
# 决策：保持现状——升级 httpx→httpx2 会替换核心依赖，违反「禁止只为消除 warning 替换核心依赖」。
# 此配置使任何新增 warning 立即失败，防止退化为「冒充通过」。
filterwarnings =
    error
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated:DeprecationWarning