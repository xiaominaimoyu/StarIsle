<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>私人书桌 · 星屿</title>
  <link rel="stylesheet" href="/private/assets/desk.css">
</head>
<body>
  <a class="skip" href="#main">跳到内容</a>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand sidebar-brand" href="/private/">
        <span class="seal" aria-hidden="true">星</span>
        <span class="brand-text"><strong>星屿</strong><small>DESK</small></span>
      </a>
      <nav class="nav-list" data-nav aria-label="私人书桌">
        <a class="nav-link" href="/private/album">相册</a>
        <a class="nav-link" href="/private/messages">来信</a>
        <a class="nav-link" href="/private/notes">手记</a>
        <a class="nav-link" href="/private/ask">问屿</a>
        <a class="nav-link" href="/private/" aria-current="page">总览</a>
      </nav>
    </aside>
    <div class="shell-main">
      <header class="shell-header">
        <div>
          <p class="eyebrow">ON THIS COMPUTER</p>
          <h1>总览</h1>
        </div>
        <button class="ghost" type="button" data-logout>退出</button>
      </header>
      <main id="main" class="board">
        <section class="count-row" aria-label="一眼看完">
          <a class="count-card" href="/private/album"><strong data-count="photos">0</strong><span>照片</span></a>
          <a class="count-card" href="/private/messages"><strong data-count="unread">0</strong><span>未读来信</span></a>
          <a class="count-card" href="/private/notes"><strong data-count="notes">0</strong><span>手记</span></a>
          <a class="count-card" href="#todos"><strong data-count="todos">0</strong><span>未完成</span></a>
        </section>
        <p class="quiet" data-index>问屿索引还在读取。</p>
        <section id="todos" aria-label="待办">
          <h2>待办</h2>
          <form data-todo-form class="todo-form">
            <input data-todo-text type="text" maxlength="200" required placeholder="写一件要做的事">
            <input data-todo-due type="date" aria-label="截止日期">
            <button class="primary" type="submit">添加</button>
          </form>
          <p class="empty" data-todo-empty hidden>还没有待办。</p>
          <div class="letter-list" data-todos></div>
        </section>
        <section aria-label="最近">
          <h2>最近</h2>
          <p class="empty" data-activity-empty hidden>最近还没有新的照片、来信或手记。</p>
          <div class="letter-list" data-activity></div>
        </section>
      </main>
      <dialog id="confirm-delete">
        <h2>确认删除</h2>
        <p>这件待办会从书桌上拿掉。</p>
        <div class="dialog-actions">
          <button id="confirm-cancel" class="ghost" type="button">取消</button>
          <button id="confirm-ok" class="danger" type="button">确认删除</button>
        </div>
      </dialog>
    </div>
  </div>
  <script type="module" src="/private/assets/home.js"></script>
</body>
</html>
