<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>相册 · 星屿私人书桌</title>
  <link rel="stylesheet" href="/private/assets/desk.css">
</head>
<body>
  <a class="skip" href="#main">跳到内容</a>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand sidebar-brand" href="/private/">
        <span class="seal" aria-hidden="true">星</span>
        <span class="brand-text"><strong>星屿</strong><small>DESK</small></span>
      </a>
      <nav class="nav-list" data-nav aria-label="私人书桌">
        <a class="nav-link" href="/private/album" aria-current="page">相册</a>
        <a class="nav-link" href="/private/messages">来信</a>
        <a class="nav-link" href="/private/notes">手记</a>
        <button class="nav-link is-disabled" type="button" aria-disabled="true">问屿</button>
        <button class="nav-link is-disabled" type="button" aria-disabled="true">总览</button>
      </nav>
    </aside>
    <div class="shell-main">
      <header class="shell-header">
        <div>
          <p class="eyebrow">PRIVATE ALBUM</p>
          <h1>相册</h1>
        </div>
        <div class="header-actions">
          <button class="primary" type="button" data-upload>上传照片</button>
          <button class="ghost" type="button" data-logout>退出</button>
        </div>
      </header>
      <main id="main">
        <p id="album-status" data-status role="status" hidden></p>
        <input id="photo-file" class="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
        <p class="empty" data-empty hidden>相册还是空的。上传第一张照片。</p>
        <div class="album-grid" data-grid></div>
        <p><button class="load-more" type="button" data-more hidden>加载更多</button></p>
      </main>
    </div>
  </div>
  <dialog id="viewer" class="viewer">
    <img id="viewer-image" alt="">
    <div class="dialog-actions"><button id="viewer-close" class="ghost" type="button">关闭</button></div>
  </dialog>
  <dialog id="confirm-delete">
    <h2>确认删除</h2>
    <p id="confirm-text"></p>
    <div class="dialog-actions">
      <button id="confirm-cancel" class="ghost" type="button">取消</button>
      <button id="confirm-ok" class="danger" type="button">确认删除</button>
    </div>
  </dialog>
  <script type="module" src="/private/assets/album.js"></script>
</body>
</html>
