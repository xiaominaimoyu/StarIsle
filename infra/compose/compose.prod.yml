# 星屿 StarIsle · 生产入口覆盖层。
# 必须与 compose.yml 合并使用；域名、ACME 邮箱和 API env_file 均不得回退到本地默认值。

services:
  caddy:
    ports:
      - target: 80
        published: "${CADDY_HTTP_HOST_PORT:-80}"
        protocol: tcp
      - target: 443
        published: "${CADDY_HTTPS_HOST_PORT:-443}"
        protocol: tcp
      - target: 443
        published: "${CADDY_HTTPS_HOST_PORT:-443}"
        protocol: udp
    environment:
      STAR_ISLE_SITE_ADDRESS: ${STAR_ISLE_SITE_ADDRESS:?STAR_ISLE_SITE_ADDRESS must be explicitly set for production}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be explicitly set for production}

  api:
    env_file:
      - path: ${STAR_ISLE_API_ENV_FILE:?STAR_ISLE_API_ENV_FILE must be explicitly set for production}
        required: true
        # Argon2id 哈希含 $；raw 防止 Compose 将其误当变量展开。
        format: raw
    environment:
      STAR_ISLE_ENV: production
      COOKIE_SECURE: "true"
